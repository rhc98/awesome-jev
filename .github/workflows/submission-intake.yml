name: Submission intake

# Validates a submitted repository URL and seeds it into data/submissions.yaml, which
# pipeline/discover.ts reads as a discovery source. The verdict comes back later, from
# submission-verdict.yml, once the daily Curate run has judged it.
#
# The issue body never reaches this file. Only the issue number crosses into the job, through
# env rather than a ${{ }} expansion inside run:, and pipeline/submissions.ts fetches the body
# itself over the API.

on:
  # No `labeled`. The issue form applies the label as the issue is created, so `labeled` fires
  # alongside `opened` for every submission; the concurrency group then cancels one of the pair
  # at random and the survivor does the same work twice over. Retro-ingesting an issue the
  # trigger missed is what the workflow_dispatch input below is for.
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to (re)ingest"
        required: true
        type: string

permissions:
  contents: read # the push below authenticates as BOT_TOKEN via the checkout credential
  issues: write # comments post as github-actions[bot], never as the maintainer

# Keyed per issue, not per workflow. A repository-wide group does not queue runs: GitHub keeps
# at most one pending run per group and cancels any earlier pending one, so two submissions
# arriving while a third is in flight would leave the middle one silently unanswered. Per issue,
# runs for different issues never contend, and the only thing that coalesces is repeat events
# for the same issue, which is what we want. Concurrent pushes are handled in the commit step.
concurrency:
  group: submission-intake-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  intake:
    # Blank issues are still allowed, so the title prefix backs up the label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'submission') ||
      startsWith(github.event.issue.title, 'Submit: ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      # BOT_TOKEN is the credential that can push to main: the branch ruleset requires a pull
      # request and admits only the admin bypass. Same arrangement as curate.yml.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate and seed
        id: intake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm tsx pipeline/submissions.ts --issue "$ISSUE"

      # Only data/submissions.yaml is staged here, and curate.yml's commit step stages an
      # explicit list that excludes it — so intake and the daily run never contend.
      #
      # Two intake runs can, though, and both append to the end of the same YAML map, which is
      # the one place a rebase would conflict. So a rejected push does not replay the commit:
      # it resets to the new tip and re-runs the script, which reads the current file and sets
      # its one key again. That also self-corrects if the repo was judged in the meantime —
      # the rerun decides there is nothing to seed, and the later GITHUB_OUTPUT wins, so the
      # reply below becomes the verdict rather than a stale "queued".
      - name: Commit
        if: steps.intake.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "awesome-jev-bot"
          git config user.email "bot@awesome-jev.xyz"
          for attempt in 1 2 3; do
            git add data/submissions.yaml
            if git diff --cached --quiet; then
              echo "nothing left to commit"
              exit 0
            fi
            git commit -m "submit: queue ${{ steps.intake.outputs.repo }} (#${{ env.ISSUE }})"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebuilding on the new tip"
            git fetch origin main
            git reset --hard origin/main
            pnpm tsx pipeline/submissions.ts --issue "$ISSUE"
          done
          echo "::error::Could not push after 3 attempts"
          exit 1

      - name: Reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT: ${{ steps.intake.outputs.comment }}
          LABEL: ${{ steps.intake.outputs.label }}
          CLOSE: ${{ steps.intake.outputs.close }}
        run: |
          gh issue comment "$ISSUE" --body-file "$COMMENT"
          if [ -n "$LABEL" ]; then gh issue edit "$ISSUE" --add-label "$LABEL"; fi
          if [ -n "$CLOSE" ]; then gh issue close "$ISSUE" --reason "$CLOSE"; fi
