name: Curate

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip code search and per-day windows"
        type: boolean
        default: false
      days:
        description: "Per-day search window in days, or 'all' to backfill since launch (default 7)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: curate
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    # Without this the job inherits the 6h default. A run that sits in rate-limit
    # sleep for hours blocks the next day's scheduled run (concurrency group above
    # does not cancel in progress) and burns runner time invisibly. The enriched
    # cache makes a timeout a checkpoint rather than a loss: the next run resumes.
    timeout-minutes: 90
    steps:
      # BOT_TOKEN (fine-grained PAT, contents:write) lets the bot push to main through the
      # admin bypass of the branch ruleset. Falls back to GITHUB_TOKEN if unset.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # enrich skips any repo whose pushed_at is unchanged, but data/enriched/ is
      # gitignored, so CI always started cold and re-fetched all ~580 repos. Carrying
      # the cache between runs cuts a steady-state run to the repos that actually moved.
      # Cache entries are immutable, hence the run_id key with a rolling restore prefix.
      - name: Restore enriched cache
        uses: actions/cache/restore@v4
        with:
          path: data/enriched
          key: enriched-${{ github.run_id }}
          restore-keys: enriched-

      # discover/enrich lean on the core and search APIs: 579 candidates x up to 4 calls
      # each overruns GITHUB_TOKEN's 1,000 req/hr per-repo budget on a cold run. A PAT
      # gets 5,000/hr in its own bucket. But a fine-grained PAT without public-repo read
      # 404s on every external repo, and discover treats a 404 as "repo is gone" and drops
      # the candidate — silent data loss. So prove the token can read a public repo first,
      # and fall back to GITHUB_TOKEN if it cannot.
      - name: Pick API token
        id: tok
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          pick=github
          if [ -n "$BOT_TOKEN" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $BOT_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/vercel/next.js)
            if [ "$code" = "200" ]; then
              pick=bot
            else
              echo "::warning::BOT_TOKEN cannot read public repos (HTTP $code) — falling back to GITHUB_TOKEN, expect rate-limit sleeps"
            fi
          fi
          echo "pick=$pick" >> "$GITHUB_OUTPUT"
          echo "api token: $pick"

      - name: Discover
        env:
          GITHUB_TOKEN: ${{ steps.tok.outputs.pick == 'bot' && secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days }}
        run: pnpm discover ${{ inputs.quick && '--quick' || '' }} ${DAYS:+--days "$DAYS"}

      - name: Enrich
        env:
          GITHUB_TOKEN: ${{ steps.tok.outputs.pick == 'bot' && secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: pnpm enrich

      # Saved before Judge so a later failure, or the job timeout, still banks the
      # fetches this run paid for.
      - name: Save enriched cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/enriched
          key: enriched-${{ github.run_id }}

      - name: Judge
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm judge --concurrency 4

      - name: Curate and build
        run: pnpm curate && pnpm readme

      - name: Commit
        run: |
          git config user.name "awesome-jev-bot"
          git config user.email "bot@awesome-jev.xyz"
          # data/submissions.yaml is deliberately absent: submission-intake.yml is its only
          # writer, and keeping the two file sets disjoint is what lets both jobs push to main
          # without ever conflicting on a rebase.
          git add data/candidates.jsonl data/repos.jsonl data/judgments.jsonl data/curated.json README.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "curate: $(date -u +%Y-%m-%d) — $(node -e 'const c=require("./data/curated.json").stats;console.log(`${c.total} judged, ${c.listed} listed, ${c.review} review`)')"
          # A run takes minutes to an hour, and the concurrency group only holds off other
          # curate runs — a pull request merged meanwhile moves main and the push is rejected,
          # throwing away everything the run just computed. This commit only carries generated
          # data, so replaying it on the new tip is safe. A conflict means the artifacts were
          # edited by hand, which should fail loudly rather than be resolved here.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), replaying onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::Could not push after 3 attempts; main is moving faster than the run"
          exit 1
