<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Jev pipeline · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 728px; }
    .step-number, .step-label, .lane-label, .role-text, .chip-text, .legend-label { font-family: var(--mono); text-anchor: middle; }
    .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
    .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
    .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
    .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
    .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
    .focal-text { fill: var(--accent); }
    .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 7px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · awesome-jev.xyz</p>
    <h1>A list that judges itself</h1>

    <svg viewBox="0 0 728 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
      <title id="pipeline-title">Awesome Jev curation pipeline</title>
      <desc id="pipeline-desc">GitHub search and community lists feed candidate repositories into code that enriches them, Jev judges each one in a single call, code applies the policy with optional human overrides, and the README and site are published daily.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
        <marker id="arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="728" height="436" fill="#f5f5f5"/>
      <rect width="728" height="436" fill="url(#dots)"/>
      <rect x="0" y="36" width="728" height="80" fill="rgba(45,49,66,0.018)"/>
      <rect x="0" y="196" width="728" height="80" fill="rgba(45,49,66,0.018)"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="728" y2="36" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="728" y2="116" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="728" y2="196" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="728" y2="276" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="0" y1="356" x2="728" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="356" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">DISCOVER</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">ENRICH</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="rgba(235,108,54,0.20)"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">JUDGE</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">CURATE</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="rgba(45,49,66,0.12)"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">PUBLISH</text>
      </g>

      <g aria-label="Role lanes">
        <text x="70" y="72" class="lane-label">GITHUB</text><text x="70" y="84" class="lane-label">API</text>
        <text x="70" y="152" class="lane-label">PIPELINE</text><text x="70" y="164" class="lane-label">CODE</text>
        <text x="70" y="232" class="lane-label">JEV</text><text x="70" y="244" class="lane-label">MODEL</text>
        <text x="70" y="312" class="lane-label">HUMANS</text><text x="70" y="324" class="lane-label">READERS</text>
      </g>

      <!-- Connectors first. Cross-lane paths use r=8 orthogonal elbows. -->
      <path d="M196 108 V124" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M246 156 H258" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M358 156 H412 Q420 156 420 164 V204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/>
      <path d="M470 236 H508 Q516 236 516 228 V188" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M548 284 V188" fill="none" stroke="#4f5d75" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
      <path d="M582 156 H594" fill="none" stroke="#4f5d75" marker-end="url(#arr-muted)"/>
      <path d="M644 188 V284" fill="none" stroke="#2e5aa8" marker-end="url(#arr-link)"/>
      <rect x="360" y="136" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="392" y="145" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATE · 11 Q</text>

      <!-- GitHub API: Search and lists -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="53" class="role-text">GH</text>
      <text x="196" y="67" class="node-title">Search &amp; Lists</text><text x="196" y="79" class="node-sub">repo + code search</text><text x="196" y="91" class="node-tool">+ 6 community lists</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">RP</text>

      <!-- Code: Candidates -->
      <rect x="146" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="150" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="159" y="133" class="role-text">TS</text>
      <text x="196" y="147" class="node-title">Candidates</text><text x="196" y="159" class="node-sub">dedupe · drop forks</text><text x="196" y="171" class="node-tool">candidates.jsonl</text>
      <rect x="150" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="158" y="184" class="chip-text">RP</text>
      <rect x="226" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="184" class="chip-text">RP</text>

      <!-- Code: Enrich -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="271" y="133" class="role-text">TS</text>
      <text x="308" y="147" class="node-title">Enrich</text><text x="308" y="159" class="node-sub">README · manifests</text><text x="308" y="171" class="node-tool">repos.jsonl · cache</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="184" class="chip-text">RP</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="346" y="184" class="chip-text">ST</text>

      <!-- Jev: Judge (focal) -->
      <rect x="370" y="204" width="100" height="64" rx="6" fill="rgba(235,108,54,0.07)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="374" y="208" width="18" height="10" rx="3" fill="rgba(235,108,54,0.20)"/><text x="383" y="213" class="role-text focal-text">JEV</text>
      <text x="420" y="227" class="node-title">Judge</text><text x="420" y="239" class="node-sub">11 questions · 1 call</text><text x="420" y="251" class="node-tool">jev-latest · ~260 ms</text>
      <rect x="374" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="382" y="264" class="chip-text">ST</text>
      <rect x="450" y="258" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="458" y="264" class="chip-text">PB</text>

      <!-- Code: Policy -->
      <rect x="482" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="486" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="495" y="133" class="role-text">TS</text>
      <text x="532" y="147" class="node-title">Policy</text><text x="532" y="159" class="node-sub">thresholds · weights</text><text x="532" y="171" class="node-tool">curate.ts · no inference</text>
      <rect x="486" y="178" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="494" y="184" class="chip-text">PB</text>
      <rect x="562" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="570" y="184" class="chip-text">CU</text>

      <!-- Code: Build -->
      <rect x="594" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="598" y="128" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="607" y="133" class="role-text">TS</text>
      <text x="644" y="147" class="node-title">Build</text><text x="644" y="159" class="node-sub">README + static site</text><text x="644" y="171" class="node-tool">daily 06:00 UTC</text>
      <rect x="598" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="606" y="184" class="chip-text">CU</text>
      <rect x="674" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="184" class="chip-text">CU</text>

      <!-- Humans: Overrides -->
      <rect x="482" y="284" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="486" y="288" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="495" y="293" class="role-text">HUM</text>
      <text x="532" y="307" class="node-title">Overrides</text><text x="532" y="319" class="node-sub">reason required</text><text x="532" y="331" class="node-tool">overrides.yaml · PR</text>
      <rect x="562" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="570" y="344" class="chip-text">CU</text>

      <!-- Readers: Site and README -->
      <rect x="594" y="284" width="100" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.25)"/>
      <rect x="598" y="288" width="18" height="10" rx="3" fill="rgba(45,49,66,0.12)"/><text x="607" y="293" class="role-text">HUM</text>
      <text x="644" y="307" class="node-title">awesome-jev.xyz</text><text x="644" y="319" class="node-sub">index · review queue</text><text x="644" y="331" class="node-tool">README on GitHub</text>
      <rect x="598" y="338" width="16" height="8" rx="3" fill="#9c6b50"/><text x="606" y="344" class="chip-text">CU</text>

      <!-- Legend: steps -->
      <text x="164" y="373" class="legend-label">STEPS</text>
      <rect x="180" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="192" y="372" class="step-number">01</text><text x="212" y="373" class="legend-text">Discover</text>
      <rect x="272" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="284" y="372" class="step-number">02</text><text x="304" y="373" class="legend-text">Enrich</text>
      <rect x="360" y="364" width="24" height="12" rx="6" fill="rgba(235,108,54,0.20)"/><text x="372" y="372" class="step-number focal-text">03</text><text x="392" y="373" class="legend-text">Judge</text>
      <rect x="452" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="464" y="372" class="step-number">04</text><text x="484" y="373" class="legend-text">Curate</text>
      <rect x="544" y="364" width="24" height="12" rx="6" fill="rgba(45,49,66,0.12)"/><text x="556" y="372" class="step-number">05</text><text x="576" y="373" class="legend-text">Publish</text>

      <!-- Legend: data types -->
      <text x="164" y="394" class="legend-label">DATA TYPE</text>
      <rect x="180" y="386" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="392" class="chip-text">RP</text><text x="202" y="394" class="legend-text">Repo metadata</text>
      <rect x="276" y="386" width="16" height="8" rx="3" fill="#b8915a"/><text x="284" y="392" class="chip-text">ST</text><text x="298" y="394" class="legend-text">State JSON</text>
      <rect x="360" y="386" width="16" height="8" rx="3" fill="#7c8f6f"/><text x="368" y="392" class="chip-text">PB</text><text x="382" y="394" class="legend-text">Probabilities</text>
      <rect x="452" y="386" width="16" height="8" rx="3" fill="#9c6b50"/><text x="460" y="392" class="chip-text">CU</text><text x="474" y="394" class="legend-text">Curated JSON</text>
      <text x="560" y="394" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="416" class="legend-label">FLOW</text>
      <line x1="180" y1="413" x2="204" y2="413" stroke="#4f5d75" marker-end="url(#arr-muted)"/><text x="212" y="416" class="legend-text">Standard handoff</text>
      <line x1="308" y1="413" x2="332" y2="413" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arr-accent)"/><text x="340" y="416" class="legend-text">Only model call</text>
      <line x1="428" y1="413" x2="452" y2="413" stroke="#4f5d75" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/><text x="460" y="416" class="legend-text">Human override</text>
      <line x1="560" y1="413" x2="584" y2="413" stroke="#2e5aa8" marker-end="url(#arr-link)"/><text x="592" y="416" class="legend-text">Published</text>
    </svg>
  </main>
</body>
</html>
